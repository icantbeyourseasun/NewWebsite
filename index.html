<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveyList</title>
    
    <style>
        body {
            background-color: #ffe5f8; /* สีพื้นหลัง (สีชมพูอ่อน) */
            text-align: center; /* จัดทุกอย่างให้อยู่ตรงกลางจอ */
            font-family: 'FC Lamoon', sans-serif; /* เปลี่ยนฟอนต์ให้น่ารักๆ */
        }
        
        button {
            background-color: #eed5e7; /* สีพื้นหลัง (สีชมพูอ่อน) */
            color: rgb(0, 0, 0); /* สีตัวหนังสือบนปุ่ม */
            padding: 10px 20px; /* ทำให้ปุ่มอ้วนขึ้น (บนล่าง 10 ซ้ายขวา 20) */
            border-radius: 50px; /* ลบเหลี่ยมปุ่มให้โค้งมน */
            border: none; /* เอาขอบปุ่มสีดำๆ ออก */
            font-size: 20px; /* ตัวหนังสือบนปุ่มใหญ่ขึ้น */
            cursor: pointer; /* ตอนเอาเมาส์ชี้ ให้เปลี่ยนเป็นรูปนิ้ว */
        }

        button:hover {
            background-color: #ffc1e5; /* สีปุ่มเมื่อเอาเมาส์ชี้ (สีชมพูเข้มขึ้น) */
            transform: scale(1.1); /* ขยายขนาดปุ่มให้ใหญ่ขึ้นนิดนึง (ว้าว!) */
            box-shadow: 0 4px 15px rgba(255, 173, 223, 0.585); /* เพิ่มเงาเรืองแสงเท่ๆ */
            cursor: pointer; /* เปลี่ยนรูปเมาส์เป็นนิ้วจิ้ม */
        }

    </style>
</head>
   
</html>
